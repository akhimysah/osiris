const params = new URLSearchParams(window.location.search);
const slug = params.get('b');
const brand = brands[slug];

if (!brand) {
    window.location.href = 'index.html#brands';
}

document.title = `${brand.name} — OSIRIS GROUP`;

// Hero
document.getElementById('brandHero').innerHTML = `
    <div class="brand-hero-bg${brand.isLogo ? ' is-logo' : ''}">${brand.video ? `<video autoplay muted loop playsinline preload="metadata" src="${brand.video}"></video>` : `<img src="${brand.image}" alt="${brand.name}">`}</div>
    <div class="brand-universe-tag">Filiale Osiris Group · ${brand.universe}</div>
    <div class="brand-icon-big">${brand.icon}</div>
    <div class="brand-category-big">${brand.category}</div>
    <h1>${brand.title.map(t => `<span style="display:block">${t.includes('&') || t.includes('de') ? `<span class="italic">${t}</span>` : t}</span>`).join('')}</h1>
    <p class="brand-tagline">"${brand.tagline}"</p>
    <p class="brand-desc-big">${brand.desc}</p>
    <div class="brand-ctas">
        <a href="${brand.url}" target="_blank" rel="noopener" class="btn-primary">Visiter le site</a>
        <a href="index.html#brands" class="btn-outline">Autres marques</a>
    </div>
`;

// Details
document.getElementById('detailsSection').innerHTML = `
    <div class="section-header">
        <span class="section-num">→</span>
        <span class="section-label">Les piliers de la marque</span>
    </div>
    <div class="details-grid">
        ${brand.details.map(d => `
            <div class="detail-card reveal">
                <div class="num">— ${d.num}</div>
                <h3>${d.title}</h3>
                <p>${d.text}</p>
            </div>
        `).join('')}
    </div>
`;

// About
document.getElementById('brandAbout').innerHTML = `
    <h2>${brand.tagline.replace(/\./g, '<span class="italic">.</span>')}</h2>
    <p>${brand.about}</p>
`;

// CTA
document.getElementById('brandCta').innerHTML = `
    <h2>Découvrir<br><span class="italic">${brand.name}</span></h2>
    <p>Visitez le site officiel pour plonger dans l'univers complet de la marque.</p>
    <a href="${brand.url}" target="_blank" rel="noopener" class="btn-primary">Visiter ${brand.name}</a>
`;

// Other brands
document.getElementById('otherBrands').innerHTML = Object.entries(brands)
    .filter(([s]) => s !== slug)
    .slice(0, 8)
    .map(([s, b]) => `
        <a href="brand.html?b=${s}" class="other-card">
            <div class="icon">${b.icon}</div>
            <div class="cat">${b.category}</div>
            <div class="name">${b.name}</div>
        </a>
    `).join('');

// Cursor
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursorRing');
let mX = 0, mY = 0, rX = 0, rY = 0;
document.addEventListener('mousemove', (e) => {
    mX = e.clientX; mY = e.clientY;
    cursor.style.left = mX + 'px'; cursor.style.top = mY + 'px';
});
(function animR() {
    rX += (mX - rX) * 0.15; rY += (mY - rY) * 0.15;
    cursorRing.style.left = rX + 'px'; cursorRing.style.top = rY + 'px';
    requestAnimationFrame(animR);
})();
document.querySelectorAll('a, button, .detail-card, .other-card').forEach(el => {
    el.addEventListener('mouseenter', () => { cursor.classList.add('hover'); cursorRing.classList.add('hover'); });
    el.addEventListener('mouseleave', () => { cursor.classList.remove('hover'); cursorRing.classList.remove('hover'); });
});

// Reveal
const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
}, { threshold: 0.1 });
setTimeout(() => document.querySelectorAll('.reveal').forEach(el => obs.observe(el)), 100);
</script>
